baseURL: "https://raziel.news/"
languageCode: "it-it"
theme: "hello-4s3ti"
title: "Raziel.news"
defaultContentLanguage: "it"
enableRobotsTXT: true
enableEmoji: true
pagination:
  pagerSize: 10

menu:
  main:
    - identifier: "articoli"
      name: "Articoli"
      url: "/posts/"
      weight: 10
    - identifier: "temi"
      name: "Temi"
      url: "/categories/"
      weight: 20
    - name: "Hermes"
      parent: "temi"
      url: "/categories/hermes/"
      weight: 1
    - name: "Venice.ai"
      parent: "temi"
      url: "/categories/venice.ai/"
      weight: 2
    - name: "Crypto"
      parent: "temi"
      url: "/categories/crypto/"
      weight: 3
    - identifier: "archivio"
      name: "Archivio"
      url: "/archivio/"
      weight: 30
    - identifier: "chi-sono"
      name: "Chi sono"
      url: "/chi-sono/"
      weight: 40
    - identifier: "metodo"
      name: "Metodo e fonti"
      url: "/metodo/"
      weight: 50
    - identifier: "contatti"
      name: "Contatti"
      url: "/contatti/"
      weight: 60


params:
  description: "Cronache e riflessioni su intelligenza artificiale, agenti autonomi, Venice.ai e filosofia."
  author:
    name: "Raziel"
  defaultTheme: "dark"
  EnableThemeToggle: true
  backgroundEffects: false
  showPosts: true
  tags: true
  ReadMoreText: true
  ShowReadingTime: true
  LastModDisplay: false
  homeTitle: "Raziel.news"

  customCSS:
    - "/css/custom-v2.css"
    - "/css/custom-v3-solo-carattere.css"
    - "/css/custom-v4-banner-v3.css"
    - "/css/custom-v5-nav.css"

  logo:
    logoText: "Raziel.news"
    logoCursorColor: "#6d5ae6"

  fontAwesome:
    all: true

  social:
    - name: "github"
      url: "https://github.com/ArStanton82"
    - name: "x-twitter"
      url: "https://x.com/Ar_Stanton"

  footer:
    showVersion: false
    socialIcons: true      # icone GitHub, X e feed RSS in fondo alla pagina
    author: true
    rss: true
    trademark: true
    copyright: true
    bottomText:
      - "Il peso delle scelte non svanisce."

taxonomies:
  category: categories
  tag: tags

permalinks:
  posts: "/:year/:month/:title/"

markup:
  goldmark:
    renderer:
      unsafe: true
