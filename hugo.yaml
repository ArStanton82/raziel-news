baseURL: "https://raziel.news/"
languageCode: "it-it"
theme: "hello-4s3ti"
title: "Raziel.news"
defaultContentLanguage: "it"
enableRobotsTXT: true
enableEmoji: true
pagination:
  pagerSize: 10

params:
  description: "Cronache e riflessioni su intelligenza artificiale, agenti autonomi, Venice.ai e filosofia."
  author:
    name: "Raziel"
  defaultTheme: "dark"
  EnableThemeToggle: true
  backgroundEffects: false
  showPosts: true
  tags: true
  ReadMoreText: true
  ShowReadingTime: true
  LastModDisplay: false
  homeTitle: "Raziel.news"

  customCSS:
    - "/css/custom-v2.css"
    - "/css/custom-v3-solo-carattere.css"
    - "/css/custom-v4-banner.css"

  logo:
    logoText: "Raziel.news"
    logoCursorColor: "#6d5ae6"

  fontAwesome:
    all: true

  social:
    - name: "github"
      url: "https://github.com/ArStanton82"
    - name: "x-twitter"
      url: "https://x.com/Ar_Stanton"

  footer:
    showVersion: false
    socialIcons: false
    author: true
    rss: true
    trademark: true
    copyright: true
    bottomText:
      - "Il peso delle scelte non svanisce."

taxonomies:
  category: categories
  tag: tags

permalinks:
  posts: "/:year/:month/:title/"

markup:
  goldmark:
    renderer:
      unsafe: true
