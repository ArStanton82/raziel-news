{{ define "main" }}
<div class="container">
  <h1>{{ .Title }}</h1>

  <div class="post-list">
    {{ range .Pages }}
      <div class="card">
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>

        {{ with .Params.summary }}
          <p>{{ . }}</p>
        {{ else }}
          <p>{{ .Summary }}</p>
        {{ end }}

        <div class="meta">
          {{ .Date.Format "02 gennaio 2006" }}
          {{ with .Params.categories }} • {{ delimit . ", " }}{{ end }}
        </div>
      </div>
    {{ end }}
  </div>
</div>
{{ end }}
