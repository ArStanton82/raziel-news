<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a10;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0f0f1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a10;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#6d5ae6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#6d5ae6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="60%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Sfondo -->
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glow1)"/>
  <rect width="1440" height="900" fill="url(#glow2)"/>

  <!-- Griglia di linee sottili -->
  <g opacity="0.15">
    <line x1="0" y1="0" x2="1440" y2="900" stroke="#6d5ae6" stroke-width="0.3"/>
    <line x1="360" y1="0" x2="1440" y2="540" stroke="#6d5ae6" stroke-width="0.3"/>
    <line x1="720" y1="0" x2="1440" y2="720" stroke="#6d5ae6" stroke-width="0.3"/>
    <line x1="1080" y1="0" x2="1440" y2="360" stroke="#6d5ae6" stroke-width="0.3"/>
    <line x1="0" y1="900" x2="1440" y2="0" stroke="#6d5ae6" stroke-width="0.3"/>
    <line x1="0" y1="540" x2="1080" y2="0" stroke="#6d5ae6" stroke-width="0.3"/>
    <line x1="0" y1="720" x2="720" y2="0" stroke="#6d5ae6" stroke-width="0.3"/>
    <line x1="0" y1="360" x2="360" y2="0" stroke="#6d5ae6" stroke-width="0.3"/>
  </g>

  <!-- Cerchi concentrici principali -->
  <g opacity="0.08">
    <circle cx="720" cy="450" r="400" fill="none" stroke="#6d5ae6" stroke-width="0.5"/>
    <circle cx="720" cy="450" r="320" fill="none" stroke="#6d5ae6" stroke-width="0.4"/>
    <circle cx="720" cy="450" r="240" fill="none" stroke="#6d5ae6" stroke-width="0.3"/>
    <circle cx="720" cy="450" r="160" fill="none" stroke="#6d5ae6" stroke-width="0.2"/>
    <circle cx="720" cy="450" r="80" fill="none" stroke="#6d5ae6" stroke-width="0.1"/>
  </g>

  <!-- Cerchi orbitali eccentrici -->
  <g opacity="0.06">
    <ellipse cx="720" cy="450" rx="350" ry="420" fill="none" stroke="#8b7cf6" stroke-width="0.4" transform="rotate(15 720 450)"/>
    <ellipse cx="720" cy="450" rx="280" ry="350" fill="none" stroke="#8b7cf6" stroke-width="0.3" transform="rotate(-20 720 450)"/>
    <ellipse cx="720" cy="450" rx="200" ry="260" fill="none" stroke="#8b7cf6" stroke-width="0.2" transform="rotate(45 720 450)"/>
  </g>

  <!-- Punti luce (stelle/particelle) -->
  <g opacity="0.5">
    <circle cx="120" cy="180" r="1.5" fill="#ffffff"/>
    <circle cx="280" cy="80" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="450" cy="220" r="1.2" fill="#ffffff" opacity="0.4"/>
    <circle cx="600" cy="120" r="0.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="850" cy="160" r="1.3" fill="#ffffff" opacity="0.3"/>
    <circle cx="1020" cy="90" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1250" cy="200" r="1.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="1350" cy="100" r="0.8" fill="#ffffff" opacity="0.6"/>
    <circle cx="150" cy="650" r="1" fill="#ffffff" opacity="0.3"/>
    <circle cx="350" cy="780" r="1.2" fill="#ffffff" opacity="0.5"/>
    <circle cx="550" cy="680" r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="700" cy="820" r="1.5" fill="#ffffff" opacity="0.3"/>
    <circle cx="950" cy="750" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1150" cy="850" r="1.2" fill="#ffffff" opacity="0.4"/>
    <circle cx="1320" cy="700" r="1" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Triangolo centrale stilizzato (simbolo Raziel) -->
  <g opacity="0.07" transform="translate(720,450)">
    <polygon points="0,-120 104,60 -104,60" fill="none" stroke="#6d5ae6" stroke-width="1"/>
    <polygon points="0,-80 69,40 -69,40" fill="none" stroke="#6d5ae6" stroke-width="0.6"/>
    <polygon points="0,-40 35,20 -35,20" fill="none" stroke="#6d5ae6" stroke-width="0.3"/>
  </g>

  <!-- Linee orizzontali sottili -->
  <g opacity="0.04">
    <line x1="0" y1="200" x2="1440" y2="200" stroke="#6d5ae6" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1440" y2="700" stroke="#6d5ae6" stroke-width="0.5"/>
  </g>
</svg>
